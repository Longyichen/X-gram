[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgram"
dynamic = ["version"]
readme = "README.md"
description = "Embedding injection research code built on top of OLMo-core"
authors = [{ name = "xgram contributors" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "torch>=2.6.0",
    "cached-path>=1.7.2",
    "requests",
    "packaging",
    "rich",
    "omegaconf",
    "safetensors",
    "importlib_resources",
]

[project.optional-dependencies]
train = [
    "duckdb",
    "transformers",
    "wandb",
]
eval = []
wandb = ["wandb"]
torchao = ["torchao"]
transformers = ["transformers"]
all = ["xgram[train,eval,wandb,torchao,transformers]"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
olmo_core = ["py.typed", "*.txt", "data/mixes/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "olmo_core.version.VERSION" }

[tool.setuptools.packages.find]
where = ["OLMo-core/src", "packages/ubdataloader/src"]
include = ["olmo_core*", "ubdataloader*"]
exclude = []

[tool.pytest.ini_options]
testpaths = "OLMo-core/src/test/"
python_classes = ["Test*", "*Test"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
log_cli = false
log_cli_level = "DEBUG"
markers = ["gpu"]
filterwarnings = [
    'ignore::FutureWarning:huggingface_hub\.file_download',
    'ignore::DeprecationWarning:pkg_resources',
    'ignore::DeprecationWarning:google\.rpc',
    'ignore::FutureWarning:torch\.distributed\.checkpoint\.default_planner',
    'ignore::UserWarning:torch\.distributed\.checkpoint\.state_dict_saver',
    'ignore::UserWarning:torch\.distributed\.checkpoint\.state_dict_loader',
]
